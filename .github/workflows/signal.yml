name: ARK 매수신호 점검

on:
  schedule:
    # 매일 22:00 UTC (= 다음날 07:00 KST). 미국 장 마감(20:00/21:00 UTC) 이후라
    # 그날 종가와 ARK 공시가 모두 확정된 뒤다.
    # 판정 자체는 주간이지만 대시보드가 묵지 않도록 데이터는 매일 갱신한다.
    # 주의: Actions 의 cron 은 정시에 뜨지 않는다. 수십 분~수시간 밀리는 것이 정상이고,
    # 부하가 크면 건너뛰기도 한다. 그래서 여유를 두고, 실제 실행 시각을 로그와 이슈에 남긴다.
    - cron: "0 22 * * *"
  workflow_dispatch:        # 수동 실행
    inputs:
      force_issue:
        description: "신호와 무관하게 이슈 생성 (알림 경로 점검용)"
        type: boolean
        default: false
      force_heartbeat:
        description: "상태 알림 강제 발송 (점검용)"
        type: boolean
        default: false

permissions:
  contents: write           # 갱신된 데이터 커밋
  issues: write             # 신호 발생 시 이슈 생성

concurrency:
  group: ark-signal
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 실행 전 데이터 기준일 기록
        id: before
        run: |
          echo "price_date=$(jq -r '.price_date // ""' data/signal_state.json)" >> "$GITHUB_OUTPUT"
          echo "holdings_date=$(jq -r '.holdings_date // ""' data/signal_state.json)" >> "$GITHUB_OUTPUT"
          echo "state_hash=$(jq -S 'del(.checked_utc)' data/signal_state.json | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 신호 판정
        id: check
        run: python signal_check.py

      - name: 새 데이터 확인
        id: freshness
        env:
          OLD_PRICE_DATE: ${{ steps.before.outputs.price_date }}
          NEW_PRICE_DATE: ${{ steps.check.outputs.price_date }}
          OLD_HOLDINGS_DATE: ${{ steps.before.outputs.holdings_date }}
          NEW_HOLDINGS_DATE: ${{ steps.check.outputs.holdings_date }}
          OLD_STATE_HASH: ${{ steps.before.outputs.state_hash }}
        run: |
          NEW_STATE_HASH=$(jq -S 'del(.checked_utc)' data/signal_state.json | sha256sum | cut -d' ' -f1)
          if [ "$NEW_STATE_HASH" != "$OLD_STATE_HASH" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "새 데이터 있음: 주가 ${OLD_PRICE_DATE:-없음} -> ${NEW_PRICE_DATE:-없음}, ARK ${OLD_HOLDINGS_DATE:-없음} -> ${NEW_HOLDINGS_DATE:-없음}"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "새 데이터 없음: 주가 $NEW_PRICE_DATE, ARK $NEW_HOLDINGS_DATE — 텔레그램을 보내지 않는다."
          fi

      - name: 보유기간별 수익률 갱신
        run: python holding_returns.py

      - name: 신호 확률 갱신
        id: prob
        run: python signal_probability.py

      - name: 보유 상태 추적 (매수/매도 판정)
        id: pos
        run: python position_tracker.py

      # 신호 집합에 의존하므로 signal_check 뒤에 둔다.
      # 실패해도 알림은 나가야 하므로 이 스텝만 막아 둔다.
      - name: 과거 신호 이후 경로와 비교
        id: trend
        continue-on-error: true
        run: python trend_compare.py

      - name: 데이터 갱신분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 ${{ steps.check.outputs.week }} (신호 ${{ steps.check.outputs.signal }})"
            git push
          fi

      - name: 신호 발생 시 이슈 생성
        if: steps.check.outputs.signal == 'true' || inputs.force_issue
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.check.outputs.week }}
        run: |
          # 매일 돌기 때문에, 같은 판정 주에 이미 이슈를 냈으면 다시 내지 않는다.
          if [ "${{ inputs.force_issue }}" != "true" ] \
             && gh issue list --state all --label signal --limit 100 \
                  --json title -q '.[].title' | grep -qF -- "$WEEK"; then
            echo "주 $WEEK 이슈가 이미 있다. 건너뛴다."
            exit 0
          fi
          # 담당자 지정: Watch 설정과 무관하게 GitHub 이 담당자에게 알림을 보낸다.
          # 레포 구독만 믿으면 알림이 조용히 안 갈 수 있다.
          gh issue create \
            --assignee "${{ github.repository_owner }}" \
            --title "${{ inputs.force_issue && '[점검] ' || '🔔 ' }}ARK 매수신호 ON — ${{ steps.check.outputs.week }}" \
            --label "signal" \
            --body "$(cat <<'EOF'
          **주 ${{ steps.check.outputs.week }} 기준 신호가 발생했다.**

          | 항목 | 값 |
          |---|---|
          | 그 주 순매수 | ${{ steps.check.outputs.net }} 주 |
          | 문턱 | ${{ steps.check.outputs.threshold }} 주 |
          | TSLA 종가 | $${{ steps.check.outputs.price }} |
          | 사상최고 대비 | ${{ steps.check.outputs.drawdown }}% |

          백테스트상 진입 시점은 **다음 거래일(월요일) 종가**다.

          ---

          ### 읽기 전에

          - 완료된 매매 15건에서 나온 결과다. 확정된 것이 아니다.
          - 측정된 강도는 데이터 정제 파라미터에 민감하다(6개월 초과수익 +14.7% ~ +45.6%).
          - 15건 중 6건이 2023-01 한 국면에 몰려 있다. 독립 사건 수는 그보다 적다.
          - 이 기간 테슬라가 -72% 낙폭에서 회복했다는 사실이 결과에 이미 들어가 있다.

          **투자 자문이 아니다.** 자세한 한계는 [README](https://github.com/go2god4u-glitch/ark-tsla-signal#한계) 참조.
          EOF
          )"

      - name: 텔레그램 매도 알림
        if: steps.pos.outputs.action == 'SELL' && steps.freshness.outputs.updated == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REASON: ${{ steps.pos.outputs.reason }}
          NSOLD: ${{ steps.pos.outputs.sold_n }}
          SLIST: ${{ steps.pos.outputs.sold_list }}
          PRICE: ${{ steps.check.outputs.price }}
          RET: ${{ steps.pos.outputs.sold_ret }}
          LEFT: ${{ steps.pos.outputs.open_count }}
        run: |
          if [ -z "$TG_TOKEN" ]; then echo "시크릿 미설정 - 건너뜀"; exit 0; fi
          TEXT=$(printf '%s\n' \
            "ARK 테슬라 매도 신호" \
            "" \
            "사유: ${REASON}" \
            "" \
            "매도 ${NSOLD}건 · 평균 ${RET}%" \
            "${SLIST}" \
            "매도가 \$${PRICE} · 남은 포지션 ${LEFT}건" \
            "" \
            "매도는 다음 거래일 종가 기준입니다." \
            "한국시간 화요일 새벽 5~6시." \
            "" \
            "주의: 완료 매매 15건에서 나온 규칙입니다." \
            "큰 상승을 놓칠 수 있습니다. 규칙은 최고점을 노리지 않습니다." \
            "" \
            "https://go2god4u-glitch.github.io/ark-tsla-signal/")
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" \
            -o /tmp/sell.json -w "HTTP %{http_code}\n"
          python3 -c "import json,sys;d=json.load(open('/tmp/sell.json'));print('전송:',d.get('ok'));sys.exit(0 if d.get('ok') else 1)"

      - name: 텔레그램 알림
        if: (steps.check.outputs.signal == 'true' && steps.freshness.outputs.updated == 'true') || inputs.force_issue
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEEK: ${{ steps.check.outputs.week }}
          NET: ${{ steps.check.outputs.net }}
          THR: ${{ steps.check.outputs.threshold }}
          PRICE: ${{ steps.check.outputs.price }}
          DD: ${{ steps.check.outputs.drawdown }}
          DDNOW: ${{ steps.check.outputs.dd_now }}
          DDF: ${{ steps.check.outputs.dd_filter }}
          TEST: ${{ inputs.force_issue }}
        run: |
          # 시크릿이 없으면 조용히 건너뛴다(미설정 환경에서 실패하지 않게)
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "텔레그램 시크릿 미설정 - 건너뜀"; exit 0
          fi
          # 여러 줄 문자열을 YAML 안에 직접 쓰면 들여쓰기가 블록 스칼라를 깨뜨린다.
          # printf 로 한 줄씩 조립한다.
          PREFIX=""
          if [ "$TEST" = "true" ]; then PREFIX="[점검] "; fi
          TEXT=$(printf '%s\n' \
            "${PREFIX}ARK 테슬라 매수신호 ON" \
            "" \
            "판정 주: ${WEEK} (금요일 기준)" \
            "그 주 순매수: ${NET} 주" \
            "문턱: ${THR} 주" \
            "TSLA: \$${PRICE} (사상최고 대비 ${DD}%)" \
            "낙폭 필터: ${DDNOW}% (기준 ${DDF}% 이하) 통과" \
            "" \
            "진입은 다음 거래일 종가. 한국시간 화요일 새벽 5~6시." \
            "" \
            "매도 규칙 (먼저 걸리는 쪽):" \
            "  A 아크 누적 -20% + 낙폭 -20% 회복 (이익 실현)" \
            "  B 아크가 단일 주에 -7% 이상 매도 (긴급 탈출)" \
            "그때 다시 알림 갑니다." \
            "" \
            "주의: 완료 매매 15건(평균 +81.5%)에서 나온 결과다. 확정이 아니다." \
            "15건 중 6건이 2023-01 한 국면에 몰려 있다." \
            "MDD -45% 를 견뎌야 나오는 수익이다." \
            "" \
            "https://go2god4u-glitch.github.io/ark-tsla-signal/")
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" \
            -o /tmp/tg.json -w "HTTP %{http_code}\n"
          python3 -c "import json,sys;d=json.load(open('/tmp/tg.json'));print('전송:',d.get('ok'));sys.exit(0 if d.get('ok') else 1)"

      - name: 일간 상태 알림 (하트비트)
        # 매일 점검은 유지하되, 주가와 ARK 보유 기준일이 모두 그대로면 보내지 않는다.
        # 따라서 보통 새 데이터가 없는 일·월요일 아침에는 조용하다.
        # 수동 force_heartbeat 는 알림 경로 점검을 위해 이 조건을 우회한다.
        if: steps.check.outputs.signal != 'true' && (steps.freshness.outputs.updated == 'true' || inputs.force_heartbeat)

        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEEK: ${{ steps.check.outputs.week }}
          NETP: ${{ steps.check.outputs.net_pct }}
          THRP: ${{ steps.check.outputs.thr_pct }}
          PROG: ${{ steps.check.outputs.progress }}
          PRICE: ${{ steps.check.outputs.price }}
          DD: ${{ steps.check.outputs.drawdown }}
          DDNOW: ${{ steps.check.outputs.dd_now }}
          DDF: ${{ steps.check.outputs.dd_filter }}
          DDOK: ${{ steps.check.outputs.dd_ok }}
          PREV: ${{ steps.check.outputs.prev_week }}
          AGO: ${{ steps.check.outputs.prev_ago }}
          HDATE: ${{ steps.check.outputs.holdings_date }}
          SCORE: ${{ steps.check.outputs.score }}
          PSCORE: ${{ steps.check.outputs.prev_score }}
          PROBLINE: ${{ steps.prob.outputs.prob_line }}
          POSN: ${{ steps.pos.outputs.open_count }}
          PRSI: ${{ steps.pos.outputs.rsi }}
          PRET: ${{ steps.pos.outputs.live_mean }}
          BSLINE: ${{ steps.pos.outputs.bsell_line }}
          BSSUB: ${{ steps.pos.outputs.bsell_sub }}
          ALLRET: ${{ steps.pos.outputs.all_mean }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "텔레그램 시크릿 미설정 - 건너뜀"; exit 0
          fi
          TEXT=$(printf '%s\n' \
            "ARK 테슬라 일간 점검 - 신호 없음" \
            "" \
            "판정 주: ${WEEK} (금요일 마감에 확정)" \
            "순매수: ${NETP}% / 문턱: ${THRP}%  (진행률 ${PROG}%)" \
            "이번 주 신호가 뜰 확률: ${PROBLINE}" \
            "낙폭 필터: ${DDNOW}% / 기준 ${DDF}% -> $([ "$DDOK" = "true" ] && echo 통과 || echo 미달)" \
            "" \
            "TSLA: \$${PRICE} (사상최고 대비 ${DD}%)" \
            "이번 주 점수: ${SCORE}/100 (참고값 — 판정에는 쓰지 않는다)" \
            "직전 신호: ${PREV} (${AGO}주 전) · 그때 점수 ${PSCORE}/100" \
            "" \
            "보유 포지션: ${POSN}건 (평균 ${PRET}%)" \
            "  매도 규칙 B: ${BSLINE}" \
            "    └ ${BSSUB}" \
            "과거 신호 16건 평균 수익: ${ALLRET}%" \
            "" \
            "데이터 기준일: ${HDATE}" \
            "https://go2god4u-glitch.github.io/ark-tsla-signal/")
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" \
            -o /tmp/hb.json -w "HTTP %{http_code}\n"
          python3 -c "import json,sys;d=json.load(open('/tmp/hb.json'));print('전송:',d.get('ok'));sys.exit(0 if d.get('ok') else 1)"

      - name: 요약
        if: always()
        run: |
          echo "### ARK 신호 점검 — ${{ steps.check.outputs.week }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 신호: **${{ steps.check.outputs.signal }}**" >> $GITHUB_STEP_SUMMARY
          echo "- 순매수 ${{ steps.check.outputs.net }} / 문턱 ${{ steps.check.outputs.threshold }}" >> $GITHUB_STEP_SUMMARY
          echo "- TSLA \$${{ steps.check.outputs.price }} (사상최고 대비 ${{ steps.check.outputs.drawdown }}%)" >> $GITHUB_STEP_SUMMARY
